<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photobioreaktor Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="js/ui/chart.min.js"></script>

    <!-- Application -->
    <script type="module" src="js/main.js"></script>
</head>

<body>

    <main class="dashboard">

        <!-- ==================== HEADER ==================== -->
        <header class="dashboard-header">
            <h1 class="dashboard-title">Photobioreaktor</h1>
        </header>


        <!-- ==================== MAIN CONTENT ==================== -->
        <div class="dashboard-content">

            <!-- ==================== SETTINGS ==================== -->
            <section class="panel settings-panel">

                <header class="panel-header">
                    <h2>Einstellungen</h2>
                </header>

                <form class="settings-form" id="settingsForm" action="/get" method="get">

                    <div class="form-group">
                        <label for="maxTemperatureField">
                            Maximale Temperatur (°C)
                        </label>

                        <input type="number" id="maxTemperatureField" name="Maximale Temperatur" step="0.1">
                    </div>


                    <div class="form-group">
                        <label for="minTemperatureField">
                            Minimale Temperatur (°C)
                        </label>

                        <input type="number" id="minTemperatureField" name="Minimale Temperatur" step="0.1">
                    </div>


                    <div class="form-group">
                        <label for="stirIntervalField">
                            Rührintervall (min)
                        </label>

                        <input type="number" id="stirIntervalField" name="Rührintervall" min="0">
                    </div>


                    <div class="form-group">
                        <label for="stirDurationField">
                            Rührdauer (min)
                        </label>

                        <input type="number" id="stirDurationField" name="Rührdauer" min="0">
                    </div>


                    <div class="form-group">
                        <label for="lightOnField">
                            Beleuchtung an
                        </label>

                        <input type="number" id="lightOnField" name="Beleuchtung an" min="0">
                    </div>


                    <div class="form-group">
                        <label for="lightOffField">
                            Beleuchtung aus
                        </label>

                        <input type="number" id="lightOffField" name="Beleuchtung aus" min="0">
                    </div>


                    <div class="form-group">
                        <label for="measurementIntervalField">
                            Messintervall (s)
                        </label>

                        <input type="number" id="measurementIntervalField" name="Speicherintervall" min="0">
                    </div>


                    <div class="settings-actions">
                        <button type="button" id="saveButton">
                            Einstellungen speichern
                        </button>
                    </div>

                </form>

            </section>


            <!-- ==================== MONITORING ==================== -->
            <section class="monitoring-panel">

                <!-- ==================== CHART ==================== -->
                <section class="panel chart-panel">

                    <header class="panel-header">
                        <h2>Messdaten</h2>
                    </header>

                    <div class="chart-wrapper">
                        <canvas id="chart"></canvas>
                    </div>


                    <div class="chart-controls">

                        <button type="button" id="startExperiment">
                            Start
                        </button>


                        <button type="button" id="stopExperiment" disabled>
                            Stop
                        </button>


                        <select id="selectExperiment" aria-label="Experiment auswählen">
                        </select>


                        <button type="button" id="downloadCsv">
                            Download CSV
                        </button>

                    </div>

                </section>


                <!-- ==================== LIVE VALUES ==================== -->
                <section class="panel sensor-panel" aria-labelledby="live-values-heading">

                    <header class="panel-header">
                        <h2 id="live-values-heading"></h2>
                    </header>


                    <div class="sensor-grid">

                        <article class="sensor-card">
                            <span class="sensor-label">
                                Zeitstempel
                            </span>

                            <span class="sensor-value">
                                <span id="espTimeField">--</span>
                                <span class="sensor-unit">s</span>
                            </span>
                        </article>


                        <article class="sensor-card">
                            <span class="sensor-label">
                                Temperatur
                            </span>

                            <span class="sensor-value">
                                <span id="tempField">--</span>
                                <span class="sensor-unit">°C</span>
                            </span>
                        </article>


                        <article class="sensor-card">
                            <span class="sensor-label">
                                Leitfähigkeit
                            </span>

                            <span class="sensor-value">
                                <span id="condField">--</span>
                                <span class="sensor-unit">ppm</span>
                            </span>
                        </article>


                        <article class="sensor-card">
                            <span class="sensor-label">
                                TDS
                            </span>

                            <span class="sensor-value">
                                <span id="turbField">--</span>
                                <span class="sensor-unit">g/L</span>
                            </span>
                        </article>


                        <article class="sensor-card">
                            <span class="sensor-label">
                                Füllvolumen
                            </span>

                            <span class="sensor-value">
                                <span id="levelField">--</span>
                                <span class="sensor-unit">%</span>
                            </span>
                        </article>

                    </div>

                </section>

            </section>

        </div>


        <!-- ==================== STATUS ==================== -->
        <section class="status-panel">

            <div class="status-item">
                <span class="status-label">Verbindung</span>
                <span class="status-value" id="connectionStatus">
                    Getrennt
                </span>
            </div>


            <div class="status-item">
                <span class="status-label">Messung</span>
                <span class="status-value" id="experimentStatus">
                    Keine Aufnahme
                </span>
            </div>

        </section>


        <!-- ==================== FOOTER ==================== -->
        <footer class="dashboard-footer">

            <div class="theme-toggle">

                <label class="toggle" for="darkModeToggle">
                    <input type="checkbox" id="darkModeToggle">

                    <span class="toggle-slider"></span>
                </label>

                <span>Dark Mode</span>

            </div>

        </footer>

    </main>

</body>

</html>
