<!DOCTYPE HTML>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobioreaktor Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="js/ui/chart.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <!-- dependencies -->
    <!-- hammer.min.js has to come BEFORE chartjs-plugin-zoom.min.js -->
    <!-- <script src="js/helper/chart.umd.js"></script>
    <script src="js/helper/hammer.min.js"></script>
    <script src="js/helper/chartjs-plugin-zoom.min.js"></script>
    <script src="js/helper/date-fns.js"></script>
    <script src="js/helper/chartjs-adapter-date-fns.umd.js"></script>
     -->
</head>

<body>
    <main class="dashboard">
        <!-- TOP NAV -->
        <div class="topnav">
            <h1>Photobioreaktor</h1>
        </div>


        <!-- MAIN CONTAINER -->
        <div class="container">

            <!-- LEFT CONTAINER -->
            <div class="left-container">

                <!-- SET PARAM -->
                <div class="settings">
                    <h2>Einstellungen</h2>
                    <form class="form-grid" id="form-grid" action="/get">

                        <label for="MaxTempField">Maximale Temperatur (°C):</label>
                        <input type="number" id="MaxTempField" name="Maximale Temperatur">

                        <label for="MinTempField">Minimale Temperatur (°C):</label>
                        <input type="number" id="MinTempField" name="Minimale Temperatur">

                        <label for="StirrIntField">Rührintervall (min):</label>
                        <input type="number" id="StirrIntField" name="Rührintervall">

                        <label for="StirrDurField">Rührdauer (min):</label>
                        <input type="number" id="StirrDurField" name="Rührdauer">

                        <label for="LightOnField">Beleuchtung an:</label>
                        <input type="number" id="LightOnField" name="Beleuchtung an">

                        <label for="LightOffField">Beleuchtung aus:</label>
                        <input type="number" id="LightOffField" name="Beleuchtung aus">

                        <label for="dateField">Datum:</label>
                        <input type="date" id="dateField">

                        <label for="timeField">Uhrzeit:</label>
                        <input type="time" id="timeField" step="1">

                        <label for="MeasIntField">Messintervall (s):</label>
                        <input type="number" id="MeasIntField" name="Speicherintervall">
                    </form>
                    <!-- Save Button -->
                    <div class="settings-button-container">
                        <button id="saveButton">Einstellungen speichern</button>
                    </div>
                </div>

                <!-- DATA DOWNLOAD -->
                <div class="download-container">
                    <h2>Download</h2>
                    <div class="download-button-container">
                        <button id="downloadButton" onclick="downloadCSV()">Download CSV</button>
                    </div>
                </div>
            </div>


            <!-- RIGHT CONTAINER -->
            <div class="right-container">
                <div class="chart-container">

                    <!-- Time Range -->
                    <!-- <div class="timerange-container">
                        <label for="timeRange">Zeitraum:</label>
                        <select id="timeRange">
                            <option value="today">Heute</option>
                            <option value="yesterday">Gestern</option>
                            <option value="7days">Letzte 7 Tage</option>
                            <option value="30days">Letzte 30 Tage</option>
                            <option value="all">Alles</option>
                        </select>
                        <div class="button-container">
                            <button id="filterButton">Zeitraum anzeigen</button>
                        </div>
                    </div> -->

                    <section class="chart-section">
                        <div class="chart-container">
                            <canvas id="chart"></canvas>
                        </div>

                        <!-- Chart Buttons -->
                        <div class="chart-button-container">
                            <!-- <input id="experimentName" type="text" , placeholder="Experiment Name"> -->

                            <button id="startExperiment">Start</button>

                            <button id="stopExperiment" disabled>Stop</button>

                            <select id="selectExperiment"></select>

                            <button id="downloadCsv">Download CSV</button>

                            <!-- <button onclick="sensorChart.resetZoom()">Reset Zoom</button> -->

                            <!-- <p>
                            <span class="label">Messintervall:</span><span id="intervalField">--</span> <span
                                class="unit">s</span>
                        </p> -->
                        </div>
                    </section>
                </div>


                <!-- LIVE VALUES -->
                <section class="values" aria-labelledby="live-values-heading">
                    <div class="header-values">
                        <h2 id="live-values-heading">Live-Werte</h2>
                    </div>

                    <div class="sensor-values">
                        <div class="value-box">
                            <p>
                                <span class="label">Zeitstempel:</span>
                                <span id="espTimeField">--</span>
                                <span class="unit">s</span>
                            </p>
                        </div>

                        <div class="value-box">
                            <p>
                                <span class="label">Temperatur:</span>
                                <span id="tempField">--</span>
                                <span class="unit">°C</span>
                            </p>
                        </div>

                        <div class="value-box">
                            <p>
                                <span class="label">Leitfähigkeit:</span>
                                <span id="condField">--</span>
                                <span class="unit">ppm</span>
                            </p>
                        </div>

                        <div class="value-box">
                            <p>
                                <span class="label">TDS:</span>
                                <span id="turbField">--</span>
                                <span class="unit">g/L</span>
                            </p>
                        </div>

                        <div class="value-box">
                            <p>
                                <span class="label">Füllvolumen:</span>
                                <span id="levelField">--</span>
                                <span class="unit">%</span>
                            </p>
                        </div>
                    </div>
                </section>
            </div>
        </div>


        <section class="state-section">
            <div class="state-container">
                <div class="connection-status">
                    <span>Connection:</span>
                    <span id="connectionStatus">Disconnected</span>
                </div>

                <div class="experiment-status">
                    <span>Measurement:</span>
                    <span id="experimentStatus">Not recording</span>
                </div>
            </div>
        </section>


        <!-- Dark Mode  -->
        <div class="bottom-nav">
            <div class="dark-mode">
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider"></span>
                </label>
                <span>Dark Mode</span>
            </div>
        </div>
    </main>

</body>

</html>
